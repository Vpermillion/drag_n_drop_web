name: Deploy interactive GitHub Pages demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    outputs:
      pages_mode: ${{ steps.pages-mode.outputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build device-local interactive demo
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Prevent Jekyll processing
        run: touch dist-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Detect the repository's Pages publishing mode
        id: pages-mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          if [ "$mode" != "workflow" ]; then
            echo "Pages uses its existing branch source. Build and tests passed; Actions deployment is intentionally skipped. Publish the built demo through the configured gh-pages branch." >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    if: needs.build.outputs.pages_mode == 'workflow'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
